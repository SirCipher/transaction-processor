[package]
name = "processor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
csv = "1.3.1"
thiserror = "2.0"
futures = "0.3"
futures-util = "0.3"
rust_decimal = "1.36.0"
parking_lot = { version = "0.12" }
lru = "0.13.0"
